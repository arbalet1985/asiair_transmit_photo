# Настройки asiair-agent (ПК в сети обсерватории, рядом с ASIAIR).
# Скопируйте в agent.yaml рядом с asiair-agent.exe.

# Ссылка на ASIAIR. Варианты:
#   192.168.1.50                         — IP (берётся шара "EMMC Images")
#   \\192.168.1.50\EMMC Images           — конкретная шара
#   smb://логин:пароль@192.168.1.50/Udisk — с логином (обычно НЕ нужен)
#   dir:Z:\                               — уже подключённый сетевой диск/папка
#   usb:                                  — флешка из ASIAIR, вставленная в этот ПК
#                                           (любая буква диска; usb:E:\ — только диск E:)
asiair: '192.168.1.50'

# Какие шары обходить, если в ссылке шара не указана (или указана "EMMC Images").
# "*" — все хранилища ASIAIR: внутренняя память, SD-карта, флешка
# (список берётся у ASIAIR, вставленная позже карта подхватится сама).
# Только внутренняя память: ["EMMC Images"].
shares: ["*"]

# Логин/пароль SMB. ASIAIR по умолчанию пускает гостя без пароля — оставьте пустыми.
# Если гость не пускает, программа сама попробует "." / "123456789".
username: ""
password: ""

# Способ связи с приёмником:
#   internet  — приёмник доступен из интернета (проброс порта на домашнем роутере);
#   tailscale — через встроенный Tailscale, без проброса портов (бесплатно).
#               Тогда в receiver_url — имя приёмника в Tailscale: https://asiair-receiver:8443
connection: internet
# Ключ Tailscale вместо входа через браузер (необязательно).
tailscale_authkey: ""

# Адрес приёмника (домашний ПК) и общий токен (одинаковый с receiver.yaml).
receiver_url: "https://my-home.example.com:8443"
token: "ВСТАВЬТЕ_ТОКЕН"
# Отпечаток сертификата приёмника: команда  asiair-receiver fingerprint
receiver_fingerprint: ""

# Ограничение скорости отправки: 10MB/s, 2MB/s, 500KB/s, 10Mbit/s, 0 = без ограничения.
# Может быть переопределено с веб-страницы приёмника.
max_rate: "10MB/s"

# Какие файлы передавать и какие папки пропускать.
extensions: [".fit", ".fits", ".jpg", ".png", ".tif", ".xisf"]
exclude: ["Thumbnail"]

scan_interval: 1m     # как часто проверять новые файлы
poll_interval: 15s    # как часто спрашивать приёмник о командах удаления
min_file_age: 30s     # файл отправляется, только если не менялся столько времени

state_file: agent-state.json
log_file: asiair-agent.log

# Ставить новую версию агента, которую передаёт приёмник (true/false).
auto_update: true
