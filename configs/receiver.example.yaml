# Настройки asiair-receiver (компьютер, куда складываются фото).
# Скопируйте в receiver.yaml рядом с asiair-receiver.exe.

# Порт для агента. Его нужно пробросить на роутере (или использовать VPN).
listen: ":8443"

# Токен (одинаковый с agent.yaml). Сгенерировать: asiair-receiver token
token: "ВСТАВЬТЕ_ТОКЕН"

# Сертификат. Если не указан — создаётся самоподписанный в data_dir,
# а его отпечаток указывается агенту (receiver_fingerprint).
tls_cert: ""
tls_key: ""
# disable_tls: true   # только если связь идёт через VPN

# Веб-страница для просмотра и удаления снимков. По умолчанию — только с этого ПК.
ui_listen: "127.0.0.1:8080"
# Если открываете страницу для сети, задайте пароль:
# ui_user: "admin"
# ui_password: "..."

dest_dir: 'D:\Astro\ASIAIR'   # куда складывать фото
data_dir: receiver-data         # служебные файлы (сертификат, очередь команд)

# Ограничение скорости, которое будет выдано агенту при первом запуске
# (потом меняется на веб-странице). Пусто — как в настройках агента.
max_rate: ""

log_file: asiair-receiver.log
