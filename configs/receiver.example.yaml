# Настройки asiair-receiver (компьютер, куда складываются фото).
# Скопируйте в receiver.yaml рядом с asiair-receiver.exe.

# Порт для агента. Его нужно пробросить на роутере (или использовать VPN).
listen: ":8443"
# Принимать агента через интернет на порту listen (порт открыт на роутере).
# Новый приёмник начинает с false: способ связи (интернет или Tailscale)
# выбирается на веб-странице, и порт не открывается зря.
internet: false

# Токен (одинаковый с agent.yaml). При первом запуске создаётся автоматически
# и показывается на веб-странице (блок «Подключение агента»).
# Вручную: asiair-receiver token
token: "ВСТАВЬТЕ_ТОКЕН"

# Сертификат. Если не указан — создаётся самоподписанный в data_dir,
# а его отпечаток указывается агенту (receiver_fingerprint).
tls_cert: ""
tls_key: ""
# disable_tls: true   # только если связь идёт через VPN

# Веб-страница для просмотра и удаления снимков. По умолчанию — только с этого ПК.
ui_listen: "127.0.0.1:8080"
# Если открываете страницу для сети, задайте пароль:
# ui_user: "admin"
# ui_password: "..."

# Куда складывать фото. Удобнее выбрать на веб-странице (блок «Папка для снимков»).
dest_dir: photos
data_dir: receiver-data         # служебные файлы (сертификат, очередь команд)

# Ограничение скорости, которое будет выдано агенту при первом запуске
# (потом меняется бегунком на веб-странице). Пусто — как в настройках агента.
# Выше скорости, заданной в агенте, агент всё равно не отправляет.
max_rate: ""

# Сколько места оставлять свободным на диске со снимками: 5%, 10GB, 500MB, 0 = без запаса.
# Когда места меньше, приём останавливается, агент ждёт. Меняется и на веб-странице.
min_free: "5%"

# Обновления с GitHub: проверять релизы, обновлять приёмник и передавать
# новую версию агенту. Токен (только чтение) нужен, пока репозиторий приватный;
# удобнее задать на веб-странице (блок «Обновления»).
auto_update: true
update_token: ""

# Вход на space-track.org (бесплатная регистрация): архив орбит спутников, чтобы
# опознавать треки на старых кадрах. Удобнее задать на веб-странице (блок «Спутники и самолёты»).
spacetrack_user: ""
spacetrack_password: ""

# API-клиент opensky-network.org (Account → API Client): самолёты возле обсерватории
# записываются ночью, чтобы опознавать их треки. Удобнее задать на веб-странице.
opensky_id: ""
opensky_secret: ""

# Пароли и токены в этом файле хранятся зашифрованными (dpapi:…, средствами Windows
# для этого компьютера). Значение, вписанное вручную открытым текстом, приёмник
# зашифрует при следующем запуске.

# Принимать агента через встроенный Tailscale (без проброса портов, бесплатно).
# Удобнее включить галочкой на веб-странице (блок «Подключение агента»).
tailscale: false

# Страница с телефона (вход по паролю). Удобнее включить на веб-странице,
# блок «Доступ с телефона»: там же задаётся пароль (здесь хранится только его хеш).
#   remote_internet  — через интернет, на порту listen (тот же, что для агента);
#   remote_tailscale — через Tailscale: https://asiair-receiver.<сеть>.ts.net
remote_internet: false
remote_tailscale: false
remote_password: ""
# Секрет одноразовых кодов (приложение-аутентификатор) — второй шаг входа
# с телефона. Включается на веб-странице; пусто — вход только по паролю.
remote_totp: ""

log_file: asiair-receiver.log
# Журнал каждый день начинается заново; прошлые дни лежат рядом
# (asiair-receiver-2026-09-25.log), через log_compress_after сжимаются в .gz,
# через log_keep удаляются. Можно 7d, 36h, 0 (log_keep: 0 — не удалять никогда,
# log_compress_after: 0 — сжимать сразу).
log_keep: 7d
log_compress_after: 3d
