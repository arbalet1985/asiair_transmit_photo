<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Атлас планировщика</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #6a7384; --border: #dde1e7; --accent: #2f6fde; --row: #f0f3f8;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12151b; --panel: #1b2029; --text: #e3e7ee; --muted: #8d96a6; --border: #2c333f; --accent: #5b92f0; --row: #222936; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  main { display: grid; grid-template-columns: minmax(200px, 280px) minmax(0, 1fr); gap: 12px; padding: 12px 16px; max-width: 1600px; margin: 0 auto; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px; min-width: 0; }
  h1 { font-size: 15px; margin: 0 0 8px; font-weight: 600; }
  button, input, select { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px; }
  button { cursor: pointer; }
  table { border-collapse: collapse; width: 100%; }
  td { padding: 5px 6px; border-bottom: 1px solid var(--border); overflow-wrap: anywhere; }
  tr { cursor: pointer; }
  tr.sel td { background: color-mix(in srgb, var(--accent) 16%, transparent); }
  tr.off td { color: var(--muted); }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .muted { color: var(--muted); font-size: 12px; }
  #atlas .atlas .asky { height: calc(100vh - 190px); min-height: 360px; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; padding: 8px; } #atlas .atlas .asky { height: 380px; } }
</style>
</head>
<body>
<main>
  <div class="panel">
    <h1>Объекты плана</h1>
    <table><tbody id="targets"></tbody></table>
    <p class="muted" id="note">Объекты и оптика — из планировщика сортировщика; кадрирование здесь меняет их там.</p>
  </div>
  <div class="panel"><div id="atlas"></div></div>
</main>
<script src="atlas.js"></script>
<script>
"use strict";
const token = new URLSearchParams(location.search).get("t") || "";
const api = (p, q) => p + "?t=" + encodeURIComponent(token) + (q || "");
const post = (p, body) => fetch(api(p), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
  .then(r => { if (!r.ok) throw new Error(r.statusText); });
let S = { rev: 0, targets: [], colors: [], sel: -1, optics: null, setups: [] };
let photoV = 0, frameReq = 0;
const note = document.getElementById("note");
const atlas = Atlas.create(document.getElementById("atlas"), {
  onFrame: (i, ra, dec, angle) => post("frame", { i, ra, dec, angle }).catch(e => { note.textContent = "Не сохранено: " + e.message; }),
  onSelect: i => select(i),
  onOptics: o => post("optics", o).catch(e => { note.textContent = "Не сохранено: " + e.message; }),
  // the sky map
  objectsURL: api("objects"),
  find: q => fetch(api("find", "&q=" + encodeURIComponent(q))).then(r => r.ok ? r.json() : []),
  onFavorite: (fav, on) => post("favorite", { fav, on }).catch(e => { note.textContent = "Избранное не сохранено: " + e.message; }),
  onAdd: o => post("add", o).then(() => { note.textContent = `«${o.label ? o.label.split(" — ")[0] : o.name}» добавлен в планировщик сортировщика.`; })
    .catch(e => { note.textContent = "Не добавлен: " + e.message; }),
});
function select(i) {
  S.sel = i;
  render();
  atlas.goTo(i);
  post("select", { i }).catch(() => {});
}
function render() {
  const tb = document.getElementById("targets");
  tb.replaceChildren(...S.targets.map((t, i) => {
    const tr = document.createElement("tr");
    tr.className = (i === S.sel ? "sel " : "") + (t.off ? "off" : "");
    const td = document.createElement("td");
    const dot = document.createElement("span");
    dot.className = "dot";
    dot.style.background = S.colors[i] || "#888";
    td.append(dot, `${i + 1}. ${t.name}`);
    tr.append(td);
    tr.onclick = () => select(i);
    return tr;
  }));
  if (!S.targets.length) tb.innerHTML = '<tr><td class="muted">В плане нет объектов: добавьте их во вкладке «Планировщик» сортировщика.</td></tr>';
}
// the state of the sorter, held by it until something changes
async function poll() {
  for (;;) {
    try {
      const r = await fetch(api("state", "&rev=" + S.rev));
      if (r.status === 403) { note.textContent = "Ссылка устарела: откройте атлас из сортировщика заново."; return; }
      if (!r.ok) throw new Error(r.statusText);
      const s = await r.json();
      const selChanged = s.sel !== S.sel;
      S = s;
      render();
      atlas.setOptics(S.optics, S.setups);
      if (S.site_set) atlas.setSite(S.lat, S.lon, S.tz);
      atlas.setSky(S.sky || null);
      atlas.setFavorites(S.favorites || []);
      atlas.setTargets(S.targets, S.colors, S.sel);
      if (selChanged && S.sel >= 0) atlas.goTo(S.sel);
      // a frame of the sorter over the sky, and the framing of its target
      if (S.photo && S.photo.v !== photoV) {
        photoV = S.photo.v;
        atlas.setPhoto({ url: api("photo.jpg", "&v=" + S.photo.v), wcs: S.photo.wcs, name: S.photo.name, width: S.photo.width, height: S.photo.height });
      } else if (!S.photo && photoV) { photoV = 0; atlas.setPhoto(null); }
      if (S.frame_req && S.frame_req !== frameReq) { frameReq = S.frame_req; atlas.frame(S.frame_i); }
    } catch (e) {
      note.textContent = "Сортировщик не отвечает — атлас обновится, когда он снова будет запущен.";
      await new Promise(f => setTimeout(f, 3000));
    }
  }
}
poll();
</script>
</body>
</html>
