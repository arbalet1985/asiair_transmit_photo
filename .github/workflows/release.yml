# Сборка релиза: .exe для Windows и бинарники для Linux прикладываются
# к релизу GitHub (Releases), а не хранятся в репозитории.
#
# Запуск:
#   * создайте релиз на GitHub (Releases → Draft a new release) с новым тегом
#     вида v1.2.0 — или отправьте такой тег командой git push origin v1.2.0;
#   * «Run workflow» на вкладке Actions с номером версии (v1.2.0) — то же
#     без создания тега вручную: тег и релиз создаются сами;
#   * «Run workflow» с пустым номером — пробная сборка без релиза:
#     файлы появятся в артефактах запуска.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Номер версии для релиза, например v1.2.0 (пусто — пробная сборка без релиза)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # тег релиза: отправленный тег или номер, введённый в «Run workflow»
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
    steps:
      - name: Проверка номера версии
        if: env.TAG != ''
        run: |
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "::error::Номер версии должен выглядеть как v1.2.0, получено: $TAG"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Тесты
        run: go test ./...

      - name: Сборка
        run: |
          if [ -n "$TAG" ]; then
            version="${TAG#v}"
            name="$TAG"
          else
            version="dev-${GITHUB_SHA::7}"
            name="$version"
          fi
          pkg=github.com/arbalet1985/asiair_transmit_photo/internal/protocol
          mkdir -p dist/windows dist/linux fp
          # Build of each program: the hash of a build without the version
          # number. A program whose code did not change gets the same hash
          # in a new release and then does not update (builds.json).
          build() { # goos out pkg extra-ldflags
            GOOS=$1 GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags "-s -w $4 -X $pkg.Version=0.0.0" -o "fp/$(basename "$2")" "$3"
            b=$(sha256sum "fp/$(basename "$2")" | cut -c1-16)
            GOOS=$1 GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags "-s -w $4 -X $pkg.Version=$version -X $pkg.Build=$b" -o "$2" "$3"
            echo "$(basename "$2") $b"
          }
          for cmd in asiair-agent asiair-receiver; do
            build windows "dist/windows/$cmd.exe" "./cmd/$cmd" "" >> builds.txt
            build linux   "dist/linux/$cmd"       "./cmd/$cmd" "" >> builds.txt
          done
          # раскладка кадров для Siril: только окно Windows
          build windows dist/windows/asiair-sorter.exe ./cmd/asiair-sorter "-H windowsgui" >> builds.txt
          cat builds.txt
          python3 -c 'import json,sys; print(json.dumps(dict(l.split() for l in open("builds.txt")), indent=1))' > builds.json
          cp configs/*.example.yaml LICENSE dist/windows/
          cp configs/*.example.yaml LICENSE dist/linux/
          mkdir -p upload
          (cd dist/windows && zip -9 "../../upload/asiair-remote-transfer-$name-windows.zip" *)
          tar -czf "upload/asiair-remote-transfer-$name-linux-amd64.tar.gz" -C dist/linux .
          cp dist/windows/*.exe builds.json upload/
          ls -l upload

      - name: Файлы пробной сборки
        if: env.TAG == ''
        uses: actions/upload-artifact@v4
        with:
          name: asiair-remote-transfer
          path: upload/
          retention-days: 7

      - name: Релиз
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # релиз, созданный на сайте вместе с тегом, уже есть: только добавляем файлы
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" upload/* --clobber
          else
            # из «Run workflow» тега ещё нет: он создаётся на собранном коммите
            gh release create "$TAG" upload/* --title "$TAG" --generate-notes --target "$GITHUB_SHA"
          fi
