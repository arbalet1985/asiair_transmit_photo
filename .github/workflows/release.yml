# Сборка релиза: .exe для Windows и бинарники для Linux прикладываются
# к релизу GitHub (Releases), а не хранятся в репозитории.
#
# Запуск:
#   * создайте релиз на GitHub (Releases → Draft a new release) с новым тегом
#     вида v1.2.0 — или отправьте такой тег командой git push origin v1.2.0;
#   * «Run workflow» на вкладке Actions с номером версии (v1.2.0) — то же
#     без создания тега вручную: тег и релиз создаются сами;
#   * «Run workflow» с пустым номером — пробная сборка без релиза:
#     файлы появятся в артефактах запуска.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Номер версии для релиза, например v1.2.0 (пусто — пробная сборка без релиза)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # тег релиза: отправленный тег или номер, введённый в «Run workflow»
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
    steps:
      - name: Проверка номера версии
        if: env.TAG != ''
        run: |
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "::error::Номер версии должен выглядеть как v1.2.0, получено: $TAG"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Тесты
        run: go test ./...

      - name: Сборка
        run: |
          if [ -n "$TAG" ]; then
            version="${TAG#v}"
            name="$TAG"
          else
            version="dev-${GITHUB_SHA::7}"
            name="$version"
          fi
          ldflags="-s -w -X github.com/arbalet1985/asiair_transmit_photo/internal/protocol.Version=$version"
          mkdir -p dist/windows dist/linux
          for cmd in asiair-agent asiair-receiver; do
            GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "$ldflags" -o "dist/windows/$cmd.exe" "./cmd/$cmd"
            GOOS=linux   GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "$ldflags" -o "dist/linux/$cmd"     "./cmd/$cmd"
          done
          cp configs/*.example.yaml dist/windows/
          cp configs/*.example.yaml dist/linux/
          mkdir -p upload
          (cd dist/windows && zip -9 "../../upload/asiair-transmit-photo-$name-windows.zip" *)
          tar -czf "upload/asiair-transmit-photo-$name-linux-amd64.tar.gz" -C dist/linux .
          cp dist/windows/*.exe upload/
          ls -l upload

      - name: Файлы пробной сборки
        if: env.TAG == ''
        uses: actions/upload-artifact@v4
        with:
          name: asiair-transmit-photo
          path: upload/
          retention-days: 7

      - name: Релиз
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # релиз, созданный на сайте вместе с тегом, уже есть: только добавляем файлы
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" upload/* --clobber
          else
            # из «Run workflow» тега ещё нет: он создаётся на собранном коммите
            gh release create "$TAG" upload/* --title "$TAG" --generate-notes --target "$GITHUB_SHA"
          fi
